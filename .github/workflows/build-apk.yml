name: Compilar APK Android (Lumina TV)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar manualmente con un clic en la pestaña Actions

jobs:
  build-apk:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 4. Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 5. Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: LuminaTV-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
